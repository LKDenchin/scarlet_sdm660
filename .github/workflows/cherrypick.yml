name: 拉取提交
on:
  workflow_dispatch:
    inputs:
      commit-hash: { description: "目标提交的哈希值" }
      target-repo: { description: "目标仓库的URL" }

jobs:
  cherry-pick:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v3

      - name: Add remote repository
        run: git remote add other-repo ${target-repo}

      - name: Fetch the target commit
        run: git fetch other-repo main

      - name: Cherry-pick the commit
        run: git cherry-pick ${commit-hash}
