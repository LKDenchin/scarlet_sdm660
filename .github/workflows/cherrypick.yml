name: 合并提交+自动PR

on:
  workflow_dispatch:
    inputs:
      commit-hash:
        description: "目标提交哈希 (40位小写十六进制)"
        required: true
      target-repo:
        description: "来源仓库 (格式：owner/repo)"
        required: true
      target-branch:
        description: "目标分支"
        default: "main"
      git-username:
        description: "GitHub用户名"
        required: true
      git-password:
        description: "GitHub密码/PAT"
        required: true
        sensitive: true

jobs:
  smart-merge:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 验证输入格式
        run: |
          if [[ ! "${{ inputs.target-repo }}" =~ ^[A-Za-z0-9_-]+\/[A-Za-z0-9_-]+$ ]]; then
            echo "::error::仓库格式错误！示例：LKDenchin/kernel_rova_bpf"
            exit 1
          fi

          if [[ ! "${{ inputs.commit-hash }}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::提交哈希格式错误！需要40位小写十六进制"
            exit 1
          fi

      - name: 配置Git身份
        run: |
          git config --global user.name "GitHub Merge Bot"
          git config --global user.email "merge-bot@noreply.github.com"

      - name: 设置安全认证
        run: |
          set +x
          echo "https://${{ inputs.git-username }}:${{ inputs.git-password }}@github.com" > ~/.git-credentials
          chmod 600 ~/.git-credentials
          git config --global credential.helper 'store --file ~/.git-credentials'

      - name: 添加远程仓库
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "https://github.com/${{ inputs.target-repo }}.git"

      - name: 获取目标代码
        run: |
          git fetch upstream "${{ inputs.target-branch }}"
          git fetch upstream "${{ inputs.commit-hash }}"

      - name: 智能合并处理
        id: merge-processor
        run: |
          parents=$(git show -s --format=%P ${{ inputs.commit-hash }})
          parent_count=$(echo $parents | wc -w)

          if [ $parent_count -eq 2 ]; then
            git cherry-pick -m 1 -n ${{ inputs.commit-hash }}
          else
            git cherry-pick -n ${{ inputs.commit-hash }}
          fi

          conflict_files=$(git diff --name-only --diff-filter=U | tr '\n' ',' | sed 's/,$//')
          remaining_files=$(git diff --cached --name-only | wc -l)

          if [ -n "$conflict_files" ]; then
            git reset .
            git restore --source=HEAD --staged --worktree -- .
            git cherry-pick --quit
          fi

          echo "conflict_files=$conflict_files" >> $GITHUB_OUTPUT
          echo "remaining=$remaining_files" >> $GITHUB_OUTPUT

      - name: 提交有效变更
        if: steps.merge-processor.outputs.remaining > 0
        run: |
          git commit -m "[智能合并] ${{ inputs.commit-hash }} from ${{ inputs.target-repo }}"
          git push origin HEAD

      - name: 创建PR
        if: steps.merge-processor.outputs.conflict_files != ''
        uses: peter-evans/create-pull-request@v4
        with:
          title: "[需要处理] 合并冲突 - ${{ inputs.commit-hash }}"
          body: "自动合并提交"
          branch: "merge-conflict/${{ inputs.commit-hash }}"
          delete-branch: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BRANCH: "merge-conflict/${{ inputs.commit-hash }}"

      - name: 清理认证信息
        if: always()
        run: rm -f ~/.git-credentials
