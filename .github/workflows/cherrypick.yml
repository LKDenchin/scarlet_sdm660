name: 拉取提交

on:
  workflow_dispatch:
    inputs:
      commit-hash:
        description: "目标提交的哈希值"
        required: true
      target-repo:
        description: "目标仓库的URL（格式：owner/repo）"
        required: true
      target-branch:
        description: "目标仓库的分支名称"
        default: "main"
      git-username:
        description: "GitHub用户名（需repo权限）"
        required: true
      git-password:
        description: "GitHub密码/PAT"
        required: true
        sensitive: true

jobs:
  cherry-pick:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 仓库（仅获取最新提交）
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # 使用 1 只获取最新的提交

      - name: 配置安全环境
        run: |
          set +x
          git config --global credential.helper 'store --file=.git-credentials'
          echo "https://${{ inputs.git-username }}:${{ inputs.git-password }}@github.com" > .git-credentials

      - name: 添加目标远程仓库
        run: |
          git remote add target-repo "https://github.com/${{ inputs.target-repo }}.git"

      - name: 拉取目标提交
        run: |
          git fetch target-repo "${{ inputs.commit-hash }}"

      - name: 处理提交
        run: |
          # 应用提交
          echo "处理提交: ${{ inputs.commit-hash }}"
          if ! git cherry-pick -n "${{ inputs.commit-hash }}"; then
            echo "检测到冲突，跳过提交: ${{ inputs.commit-hash }}"
            git cherry-pick --abort || true  # 确保即使没有进行中的 cherry-pick 也不会报错
          else
            # 提交更改并推送到目标分支
            git push origin HEAD:${{ inputs.target-branch }} --force-with-lease
          fi

      - name: 安装 GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh

      - name: 登录 GitHub CLI
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: 创建 PR
        run: |
          # 创建 PR
          git checkout -b cherry-pick-branch
          git push origin cherry-pick-branch
          gh pr create --base ${{ inputs.target-branch }} --head cherry-pick-branch --title "Cherry-pick: ${{ inputs.commit-hash }}" --body "Cherry-pick 处理的提交。"
