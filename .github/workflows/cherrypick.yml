name: 合并提交+自动PR
on:
  workflow_dispatch:
    inputs:
      commit-hash: 
        description: "目标提交哈希值（40位小写）"
        required: true
      target-repo: 
        description: "目标仓库（格式：owner/repo）"
        required: true
      target-branch: 
        description: "目标分支"
        default: "main"
      git-username: 
        description: "GitHub用户名"
        required: true
      git-password: 
        description: "GitHub密码/PAT"
        required: true
        sensitive: true

jobs:
  partial-merge:
    runs-on: ubuntu-latest
    steps:
      # ================= 初始化阶段 =================
      - name: 检出仓库（完整历史）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ================= 缓存加速 =================
      - name: 缓存Git对象
        uses: actions/cache@v3
        with:
          path: |
            ~/.git-credentials
            .git/objects
          key: ${{ runner.os }}-gitcache-${{ hashFiles('.git/modules/**/HEAD') }}
          restore-keys: |
            ${{ runner.os }}-gitcache-

      # ================= 安全配置 =================
      - name: 配置安全认证
        run: |
          set +x
          git config --global credential.helper 'store'
          echo "https://${{ inputs.git-username }}:${{ inputs.git-password }}@github.com" > ~/.git-credentials
          chmod 600 ~/.git-credentials

      # ================= 核心合并逻辑 =================
      - name: 添加动态远程仓库
        run: |
          git remote remove other-repo 2>/dev/null || true
          git remote add other-repo "https://github.com/${{ inputs.target-repo }}.git"

      - name: 拉取目标代码
        run: |
          git fetch other-repo "${{ inputs.target-branch }}"
          git fetch other-repo "${{ inputs.commit-hash }}"

      - name: 拆解提交到工作区
        run: |
          # 检测是否为合并提交
          parents=$(git show --no-patch --format="%P" ${{ inputs.commit-hash }})
          parent_count=$(echo $parents | wc -w)
          
          if [ $parent_count -eq 2 ]; then
            echo "🔀 检测到合并提交，使用 -m 1 选项"
            git cherry-pick -m 1 -n ${{ inputs.commit-hash }}
          else
            echo "⚡ 普通提交处理"
            git cherry-pick -n ${{ inputs.commit-hash }}
          fi

      - name: 智能冲突处理
        id: conflict-detector
        run: |
          conflict_files=$(git diff --name-only --diff-filter=U | tr '\n' ',' | sed 's/,$//')
          if [ -n "$conflict_files" ]; then
            echo "conflict_detected=true" >> $GITHUB_OUTPUT
            echo "conflict_files=$conflict_files" >> $GITHUB_OUTPUT
            git restore --source=HEAD --staged --worktree -- $(echo $conflict_files | tr ',' ' ')
          fi

          remaining=$(git diff --cached --name-only | wc -l)
          echo "remaining=$remaining" >> $GITHUB_OUTPUT

      # ================= 提交逻辑 =================
      - name: 提交有效变更
        if: steps.conflict-detector.outputs.remaining > 0
        run: |
          git commit -m "[Auto] 部分合并 ${{ inputs.commit-hash }}"
          git push origin HEAD

      # ================= PR自动化 =================
      - name: 创建冲突跟踪PR
        if: steps.conflict-detector.outputs.conflict_detected == 'true'
        uses: peter-evans/create-pull-request@v4
        with:
          title: "[冲突待解决] 合并 ${{ inputs.commit-hash }}"
          body: |
            ## 需手动解决的冲突文件
            $(echo ${{ steps.conflict-detector.outputs.conflict_files }} | tr ',' '\n' | sed 's/^/- `/; s/$/`/')
            
            **来源仓库**：[${{ inputs.target-repo }}@${{ inputs.commit-hash }}](https://github.com/${{ inputs.target-repo }}/commit/${{ inputs.commit-hash }})
          branch: "merge-conflict/${{ inputs.commit-hash }}"
          base: ${{ github.ref_name }}
          delete-branch: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
