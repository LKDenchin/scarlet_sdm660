name: 拉取提交
on:
  workflow_dispatch:
    inputs:
      commit-hash: { description: "目标提交的哈希值" }
      target-repo: { description: "目标仓库的URL（格式：owner/repo）" }
      target-branch: { description: "目标仓库的分支名称", default: "main" }

jobs:
  cherry-pick:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4

      - name: Add remote repository with auth
        run: |
          git remote add other-repo "https://${{ secrets.PAT }}@github.com/${{ github.event.inputs.target-repo }}.git"

      - name: Fetch the target branch
        run: git fetch other-repo "${{ github.event.inputs.target-branch }}"

      - name: Cherry-pick merge commit
        run: |
          # 明确指定父节点编号（通常为1）
          git cherry-pick -m 1 "${{ github.event.inputs.commit-hash }}"

          # 如果存在冲突，可添加自动中止逻辑
          # || (git cherry-pick --abort && exit 1)
