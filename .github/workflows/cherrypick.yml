name: 拉取提交

on:
  workflow_dispatch:
    inputs:
      commit-hash:
        description: "目标提交的哈希值（可以是范围，如A..B）"
        required: true
      target-repo:
        description: "目标仓库的URL（格式：owner/repo）"
        required: true
      target-branch:
        description: "目标仓库的分支名称"
        default: "main"
      git-username:
        description: "GitHub用户名（需repo权限）"
        required: true
      git-password:
        description: "GitHub密码/PAT"
        required: true
        sensitive: true

jobs:
  cherry-pick:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout仓库（仅获取最新提交）
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # 使用 1 只获取最新的提交

      - name: 配置安全环境
        run: |
          set +x
          git config --global credential.helper 'store --file=.git-credentials'
          echo "https://${{ inputs.git-username }}:${{ inputs.git-password }}@github.com" > .git-credentials

      - name: 添加动态远程仓库
        run: |
          git remote remove other-repo || true
          git remote add other-repo "https://github.com/${{ inputs.target-repo }}.git"

      - name: 拉取目标分支
        run: |
          git fetch --progress other-repo refs/heads/${{ inputs.target-branch }}:refs/remotes/origin/${{ inputs.target-branch }}

      - name: 拉取特定提交
        run: |
          git fetch --progress other-repo "${{ inputs.commit-hash }}"

      - name: 处理提交
        run: |
          # 解析提交范围
          commits=$(git log --format=%H --reverse --topo-order "${{ inputs.commit-hash }}")
          for commit in $commits; do
            echo "处理提交: $commit"
            
            # 检查是否可以干净地应用提交
            if ! git cherry-pick -n "$commit"; then
              echo "检测到冲突，跳过提交: $commit"
              git cherry-pick --abort || true  # 确保即使没有进行中的 cherry-pick 也不会报错
              continue
            fi
            
            # 应用提交
            git cherry-pick -m 1 "$commit"
            git push origin HEAD:refs/heads/"${{ inputs.target-branch }}" --force-with-lease
            
            # 回滚到目标分支的最新状态，准备处理下一个提交
            git reset --hard "other-repo/${{ inputs.target-branch }}"
          done
