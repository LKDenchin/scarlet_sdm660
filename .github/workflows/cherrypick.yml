name: 合并提交+自动PR

on:
  workflow_dispatch:
    inputs:
      commit-hash:
        description: "目标提交哈希 (40位小写十六进制)"
        required: true
        type: string
      target-repo:
        description: "来源仓库 (格式：owner/repo)"
        required: true
        type: string
      target-branch:
        description: "目标分支"
        default: "main"
        type: string
      git-username:
        description: "GitHub用户名"
        required: true
        type: string
      git-password:
        description: "GitHub密码/PAT"
        required: true
        type: string
        secrets: true

jobs:
  smart-merge:
    runs-on: ubuntu-latest
    steps:
    - name: 检出仓库
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: 验证输入格式
      run: |
        if [[ ! "${{ inputs.target-repo }}" =~ ^[A-Za-z0-9_-]+\/[A-Za-z0-9_-]+$ ]]; then
          echo "::error::仓库格式错误！示例：LKDenchin/kernel_rova_bpf"
          exit 1
        fi

        if [[ ! "${{ inputs.commit-hash }}" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::提交哈希格式错误！需要40位小写十六进制"
          exit 1
        fi

    - name: 配置Git身份
      run: |
        git config --global user.name "GitHub Merge Bot"
        git config --global user.email "merge-bot@noreply.github.com"

    - name: 设置安全认证
      run: |
        set +x
        echo "https://${{ inputs.git-username }}:${{ inputs.git-password }}@github.com" > ~/.git-credentials
        chmod 600 ~/.git-credentials
        git config --global credential.helper 'store --file ~/.git-credentials'

    - name: 添加远程仓库
      run: |
        git remote remove upstream 2>/dev/null || true
        git remote add upstream "https://github.com/${{ inputs.target-repo }}.git"

    - name: 获取目标代码
      run: |
        git fetch upstream "${{ inputs.target-branch }}"
        git fetch upstream "${{ inputs.commit-hash }}"

    - name: 智能合并处理
      id: merge-processor
      run: |
        commit_hash=${{ inputs.commit-hash }}
        parents=$(git show -s --format=%P "$commit_hash")
        if [ -z "$parents" ]; then
          echo "提交 $commit_hash 没有父提交，无法处理。"
          exit 1
        fi

        # 检查是否有多个父提交（如合并提交）
        if [ $(echo "$parents" | wc -w) -gt 1 ]; then
          echo "提交 $commit_hash 是一个合并提交，无法处理。"
          exit 1
        fi

        # 检查提交是否已经在当前分支上
        if git branch --contains "$commit_hash" | grep -q 'main'; then
          echo "提交 $commit_hash 已经在 main 分支上，无需合并。"
          exit 0
        fi

        # 创建新的分支进行处理
        git checkout -b "merge-processor/$commit_hash"

        # 尝试进行智能合并
        git cherry-pick "$commit_hash" || true

        # 检测是否有冲突文件
        conflict_files=$(git status --porcelain | grep 'UU' | awk '{print $2}')

        if [ -n "$conflict_files" ]; then
          echo "检测到冲突文件：$conflict_files"
          echo "conflict-files=$conflict_files" >> $GITHUB_OUTPUT

          # 尝试自动解决冲突
          for file in $conflict_files; do
            echo "尝试解决冲突文件：$file"
            git checkout --theirs -- "$file"
            git add "$file"
          done

          # 提交解决后的变更
          git commit -m "自动解决合并冲突"

          # 记录冲突文件
          echo "已记录冲突文件：$conflict_files" >> $GITHUB_OUTPUT
        else
          echo "没有检测到冲突文件。" >> $GITHUB_OUTPUT
          echo "conflict-files=" >> $GITHUB_OUTPUT
        fi

        # 提交合并结果
        git push origin "merge-processor/$commit_hash"

    - name: 提交有效变更
      id: submit-changes
      if: steps.merge-processor.outputs.conflict-files == ''
      run: |
        commit_hash=${{ inputs.commit-hash }}
        # 提交变更到主分支
        git push origin HEAD:main

        # 运行测试
        if ! ./scripts/run_tests.sh; then
          echo "测试失败，回滚变更..."
          git checkout -
          git branch -D "merge-processor/$commit_hash"
          exit 1
        fi

        # 记录成功合并
        echo "成功合并提交 $commit_hash 到 main 分支。"

    - name: 创建PR处理冲突
      id: create-pr-for-conflicts
      uses: peter-evans/create-pull-request@v4
      if: steps.merge-processor.outputs.conflict-files != ''
      with:
        title: "[需要处理] 合并冲突 - ${{ inputs.commit-hash }}"
        body: "自动合并提交时遇到冲突，已尝试自动解决。如自动解决失败，请手动处理冲突文件：${{ steps.merge-processor.outputs.conflict-files }}。"
        branch: "merge-conflict/${{ inputs.commit-hash }}"
        delete-branch: true
        labels: "需要处理, 合并冲突"
        assignees: "admin"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 清理认证信息
      id: clean-up
      run: rm -f ~/.git-credentials
      if: always()

    - name: 发送通知
      id: send-notification
      uses: dawidd6/action-send-notification@v3
      if: steps.submit-changes.status == 'success' || steps.merge-processor.outputs.conflict-files != ''
      with:
        title: "合并提交结果通知"
        message: |
          提交哈希: ${{ inputs.commit-hash }}
          目标分支: ${{ inputs.target-branch }}
          状态: ${{ steps.submit-changes.status }}
          冲突文件: ${{ steps.merge-processor.outputs.conflict-files }}
        method: slack
        webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
